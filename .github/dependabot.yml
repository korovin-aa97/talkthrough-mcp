# Weekly, grouped into single PRs to keep solo-maintainer noise low.
# Dependabot PRs come from github, run CI, and merge via squash like any PR.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    open-pull-requests-limit: 3
    ignore:
      # mcp 2.0 removed mcp.server.fastmcp and broke every fresh install
      # (the 0.2.5 emergency pin, #39/#40). pyproject bounds mcp to <2 until
      # the SDK 2.x port lands; major-bump PRs would rewrite that bound (#41).
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
