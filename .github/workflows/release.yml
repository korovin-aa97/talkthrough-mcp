# Release: build + publish to PyPI (Trusted Publishing) + GitHub Release.
#
# Triggered ONLY by pushing a version tag (v0.1.0, …). Nothing runs while the
# repo has no tags, so committing this workflow is inert until flip day.
#
# ONE-TIME MANUAL SETUP before the first tag (flip day):
#   pypi.org → account → Publishing → add a "Trusted Publisher":
#     project: talkthrough-mcp, owner: korovin-aa97,
#     repository: talkthrough-mcp, workflow: release.yml, environment: pypi
# No API tokens are stored anywhere.

name: release

on:
  push:
    tags: ["v*"]

# Least privilege by default; publish-pypi and github-release raise their
# own job-level permissions explicitly below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC certificate for the Sigstore-signed provenance.
      attestations: write # Store the signed attestation in GitHub.
      artifact-metadata: write # Associate the attestation with its artifacts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          PROJECT_VERSION="$(uv version --short)"
          uv run python scripts/extract_release_notes.py \
            --version "$PROJECT_VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --output release-notes.md
      - run: uv build

      - name: Generate signed build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Prepare provenance release asset
        run: cp "$ATTESTATION_BUNDLE" "dist/talkthrough-mcp-${RELEASE_TAG}.intoto.jsonl"
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provenance
          path: dist/*.intoto.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: release-notes.md

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: provenance
          path: provenance/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/* provenance/*
          --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
