# OpenSSF Scorecard: automated supply-chain security checks.
#
# Results are published to GitHub code scanning and the public OpenSSF API.
# All third-party actions are pinned to immutable commit SHAs. The optional
# maintainer PAT is deliberately omitted: most checks work without it, while
# Branch-Protection may have limited visibility rather than gaining a secret
# with broader repository access.

name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 2"

# Read-only unless the analysis job explicitly raises one permission below.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Publish results to the OpenSSF API for consumers/badges.
      security-events: write # Upload SARIF to GitHub code scanning.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: results.sarif
          category: OpenSSF Scorecard
